<app-page-header 
    title="Hobbies & Student Involvement" 
    subtitle="My community roles and personal passions beyond academics">
</app-page-header>

<!-- Student Involvement Section -->
<section class="section">
    <div class="container">
        <h2 class="section-title">Student Involvement</h2>
        <div class="activities-grid">
            @for (inv of involvements; track inv.title) {
                <app-activity-card 
                    [title]="inv.title" 
                    [role]="inv.role" 
                    [desc]="inv.desc" 
                    [details]="inv.details" 
                    [tags]="inv.tags" 
                    [logo]="inv.logo">
                </app-activity-card>
            }
        </div>
    </div>
</section>

<!-- Sports & Personal Passions Section -->
<section class="section" style="background: var(--bg-secondary);">
    <div class="container">
        <h2 class="section-title">Sports & Personal Passions</h2>
        <div class="activities-grid">
            @for (pass of passions; track pass.title) {
                <app-activity-card 
                    [title]="pass.title" 
                    [role]="pass.role" 
                    [desc]="pass.desc" 
                    [details]="pass.details" 
                    [tags]="pass.tags" 
                    [icon]="pass.icon" 
                    [iconColor]="pass.color">
                </app-activity-card>
            }
        </div>
    </div>
</section>

<!-- Soft Skills Developed -->
<section class="section">
    <div class="container">
        <h2 class="section-title">Skills Developed</h2>
        <div class="about-highlights">
            @for (skill of skills; track skill.title) {
                <app-highlight-card 
                    [title]="skill.title" 
                    [desc]="skill.desc" 
                    [icon]="skill.icon">
                </app-highlight-card>
            }
        </div>
    </div>
</section>
